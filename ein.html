<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قناة عين</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf7f2;font-family:Tahoma,Arial,sans-serif;color:#17456b;direction:rtl}.wrap{max-width:1180px;margin:auto;padding:18px}.head{width:100%;max-height:155px;object-fit:contain;display:block;margin:0 auto 16px}.card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 8px 28px #00000010;margin:14px 0}.homebtn,.penbtn{position:fixed;top:18px;z-index:50;width:52px;height:52px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 16px #0002;font-size:25px;cursor:pointer}.homebtn{right:18px}.penbtn{left:18px}.video{width:100%;max-height:62vh;border-radius:22px;background:#000}.btn{border:0;border-radius:18px;background:#cfefff;color:#17456b;padding:15px 28px;font-weight:700;font-size:21px;cursor:pointer;margin:8px}.btn:hover{transform:translateY(-1px)}.choices{display:grid;gap:12px}.choice{width:100%;border:0;border-radius:16px;padding:17px;background:#dff2ff;font-size:22px;color:#17456b;cursor:pointer}.title{text-align:center;font-size:30px}.center{text-align:center}.hidden{display:none!important}.feedback{position:fixed;inset:0;background:#0004;display:flex;align-items:center;justify-content:center;z-index:100}.feedback canvas{max-width:min(70vw,620px);max-height:65vh}.tools{position:fixed;left:18px;top:78px;z-index:70;background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 20px #0003;display:none;direction:ltr}.tools button{font-size:18px;margin:3px}.draw{position:fixed;inset:0;z-index:60;pointer-events:none}.draw.on{pointer-events:auto}.chest-stage{position:relative;max-width:900px;margin:auto}.chest-stage .chest{width:100%;display:block}.lock{position:absolute;width:14%;cursor:pointer;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 5px #0003)}.l1{left:28%;top:50%}.l2{left:50%;top:50%}.l3{left:72%;top:50%}.qbox{margin-top:16px;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.navcard{background:#e8f6ff;border:2px solid #bfe9f5;border-radius:22px;padding:24px;text-align:center;font-size:22px;font-weight:bold;cursor:pointer}.math{font-size:30px;direction:rtl;text-align:center}.board{position:relative}.board>img{width:100%;display:block}.boardui{position:absolute;left:28%;right:16%;top:14%;bottom:17%;display:flex;flex-direction:column;justify-content:center;align-items:center}.place{border-collapse:collapse;font-size:clamp(18px,2.1vw,34px);background:#ffffffd9}.place th,.place td{border:2px solid #7fc8df;padding:7px 18px;text-align:center}.active{background:#fff2a8}.strike{text-decoration:line-through}.smalltop{font-size:.65em;vertical-align:super;color:#d95b69;font-weight:bold}.steps{font-size:clamp(17px,1.7vw,27px);margin:10px}.controls{text-align:center;margin-top:12px}</style></head><body><button class="homebtn" onclick="home()">🏠</button><button class="penbtn" onclick="tools()">✏️</button><div id="tools" class="tools"><button onclick="tool='pen'">✏️</button><button onclick="tool='high'">🖍️</button><button onclick="tool='erase'">🧽</button><button onclick="undo()">↶</button><button onclick="clearDraw()">🗑️</button><button onclick="tools()">✕</button><br><button onclick="color='#e74c3c'">🔴</button><button onclick="color='#2980b9'">🔵</button><button onclick="color='#27ae60'">🟢</button><button onclick="color='#111'">⚫</button></div><main class="wrap"><img class="head" src="head-ein.png"><div class="card center"><h2>قناة عين</h2><p>شاهدي شرح الدرس من قناة عين.</p><button class="btn" onclick="history.back()">العودة</button></div></main><script>let drawCanvas,ctx,drawing=false,tool='pen',color='#e74c3c',hist=[];function initTools(){drawCanvas=document.createElement('canvas');drawCanvas.className='draw';document.body.appendChild(drawCanvas);ctx=drawCanvas.getContext('2d');resize();addEventListener('resize',resize);['pointerdown','pointermove','pointerup','pointercancel'].forEach(e=>drawCanvas.addEventListener(e,draw));}function resize(){if(!drawCanvas)return;let im=ctx.getImageData(0,0,drawCanvas.width||1,drawCanvas.height||1);drawCanvas.width=innerWidth;drawCanvas.height=innerHeight}function draw(e){if(e.type==='pointerdown'){drawing=true;hist.push(ctx.getImageData(0,0,drawCanvas.width,drawCanvas.height));ctx.beginPath();ctx.moveTo(e.clientX,e.clientY)}else if(e.type==='pointermove'&&drawing){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.globalAlpha=tool==='high'?0.28:1;ctx.lineWidth=tool==='high'?22:tool==='erase'?30:4;ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.lineTo(e.clientX,e.clientY);ctx.stroke()}else drawing=false}function tools(){let t=document.getElementById('tools');t.style.display=t.style.display==='block'?'none':'block';drawCanvas.classList.toggle('on',t.style.display==='block')}function undo(){if(hist.length)ctx.putImageData(hist.pop(),0,0)}function clearDraw(){ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);hist=[]}function home(){location.href='index.html'}
function chroma(src){let ov=document.createElement('div');ov.className='feedback';let v=document.createElement('video');v.src=src;v.playsInline=true;v.autoplay=true;let c=document.createElement('canvas');ov.append(c);document.body.append(ov);let x=c.getContext('2d',{willReadFrequently:true});v.onloadedmetadata=()=>{c.width=v.videoWidth;c.height=v.videoHeight;v.play();tick()};function tick(){if(v.ended){ov.remove();return}x.drawImage(v,0,0,c.width,c.height);let d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2];if(g>85&&g>r*1.28&&g>b*1.18){let k=Math.min(255,(g-Math.max(r,b))*3);p[i+3]=255-k;if(p[i+3]>0){p[i+1]=Math.min(p[i+1],Math.max(r,b)*1.1)}}}x.putImageData(d,0,0);requestAnimationFrame(tick)}ov.onclick=()=>{v.pause();ov.remove()}}document.addEventListener('DOMContentLoaded',initTools);</script></body></html>
